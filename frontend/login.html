<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Login</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden; /* 防止出現滾動條 */
      text-align: center;
    }
    
    .login-container {
      background-image: url('boeing1.jpg'); /* 替換成你的圖片路徑 */
      background-size: cover; /* 確保圖片覆蓋整個容器 */
      background-position: center; /* 圖片置中 */
      background-repeat: no-repeat; /* 不重複 */
      height: 100%; /* 讓背景高度佔滿整個視窗 */
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.9); /* 半透明白色背景 */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* 添加陰影 */
    }
    
    .login-form input {
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
    }
    .login-form button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #333;
      color: white;
    }
    .login-form button:hover {
      background-color: #575757;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-form">
      <h1>Login</h1>
      <input type="text" id="username" placeholder="Employee ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button onclick="login()">Login</button>
      <p id="error" style="color: red;"></p>
    </div>
  </div>
  

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        // 帳號密碼送到後端驗證，前端不會拿到密碼
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // 攜帶 Cookie
          body: JSON.stringify({ e_id: username, password: password })
        });
        const data = await response.json();

        if (response.ok && data.role) {
          sessionStorage.setItem('user_id', data.e_id);
          sessionStorage.setItem('user_role', data.role);
          location.href = data.role === 'Admin' ? 'admin.html' : 'user.html';
        } else {
          document.getElementById('error').textContent = data.error || 'Invalid employee ID or password';
        }
      } catch (error) {
        console.error('Error during login:', error);
        document.getElementById('error').textContent = 'An error occurred during login';
      }
    }
  </script>
</body>
</html>
